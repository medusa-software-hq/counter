version: '3'

# 🎨 TEMPLATE EJECT: Update all paths and identifiers

includes:
  infra:
    taskfile: infra/Taskfile.yml
    dir: infra

  counter-web:app:
    taskfile: apps/counter-web/app/Taskfile.yml
    dir: apps/counter-web/app

  counter-web:infra:
    taskfile: apps/counter-web/infra/Taskfile.yml
    dir: apps/counter-web/infra

  counter-service:service:
    taskfile: services/counter-service/service/Taskfile.yml
    dir: services/counter-service/service

  counter-service:infra:
    taskfile: services/counter-service/infra/Taskfile.yml
    dir: services/counter-service/infra

tasks:
  github-ci:lint:
    desc: Lint GitHub workflows
    sources:
      - '.github/workflows/*.yml'
    cmds:
      - github-ci lint

  github-ci:fixLint:
    desc: Fix lint issues in GitHub workflows
    sources:
      - '.github/workflows/*.yml'
    cmds:
      - github-ci lint --fix

  github-ci:upgrade:
    desc: Upgrade GitHub workflow actions to the latest versions
    cmds:
      - github-ci upgrade

  checkFormatting-all:
    desc: Check formatting for the entire codebase
    deps:
      - github-ci:lint
      - infra:checkFormatting
      - counter-web:app:checkFormatting
      - counter-web:infra:checkFormatting
      - counter-service:service:checkFormatting
      - counter-service:infra:checkFormatting

  fixFormatting-all:
    desc: Fix formatting for the entire codebase
    deps:
      - github-ci:fixLint
      - infra:fixFormatting
      - counter-web:app:fixFormatting
      - counter-web:infra:fixFormatting
      - counter-service:service:fixFormatting
      - counter-service:infra:fixFormatting

  lint-all:
    desc: Lint the entire codebase
    deps:
      - github-ci:lint
      - infra:lint
      - counter-web:app:lint
      - counter-web:infra:lint
      - counter-service:service:lint
      - counter-service:infra:lint

  analyze-all:
    desc: Analyze the entire codebase
    deps:
      - infra:validate
      - counter-web:app:analyze
      - counter-web:infra:validate
      - counter-service:infra:validate

  run:
    desc: Run the frontend and counter-service locally
    deps:
      - counter-web:app:run
      - counter-service:service:run
