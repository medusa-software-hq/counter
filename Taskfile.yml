version: '3'

includes:
  infra:
    taskfile: infra/Taskfile.yml
    dir: infra

  web:app:
    taskfile: apps/web/spa/Taskfile.yml
    dir: apps/web/spa

  web:infra:
    taskfile: apps/web/infra/Taskfile.yml
    dir: apps/web/infra

  api:impl:
    taskfile: backend/api/impl/Taskfile.yml
    dir: backend/api/impl

  api:infra:
    taskfile: backend/api/infra/Taskfile.yml
    dir: backend/api/infra

tasks:
  github-ci:lint:
    desc: Lint GitHub workflows
    sources:
      - '.github/workflows/*.yml'
    cmds:
      - github-ci lint

  github-ci:fixLint:
    desc: Fix lint issues in GitHub workflows
    sources:
      - '.github/workflows/*.yml'
    cmds:
      - github-ci lint --fix

  github-ci:upgrade:
    desc: Upgrade GitHub workflow actions to the latest versions
    cmds:
      - github-ci upgrade

  checkFormatting-all:
    desc: Check formatting for the entire codebase
    deps:
      - github-ci:lint
      - infra:checkFormatting
      - web:app:checkFormatting
      - web:infra:checkFormatting
      - api:impl:checkFormatting
      - api:infra:checkFormatting

  fixFormatting-all:
    desc: Fix formatting for the entire codebase
    deps:
      - github-ci:fixLint
      - infra:fixFormatting
      - web:app:fixFormatting
      - web:infra:fixFormatting
      - api:impl:fixFormatting
      - api:infra:fixFormatting

  lint-all:
    desc: Lint the entire codebase
    deps:
      - github-ci:lint
      - infra:lint
      - web:app:lint
      - web:infra:lint
      - api:impl:lint
      - api:infra:lint

  analyze-all:
    desc: Analyze the entire codebase
    deps:
      - infra:validate
      - web:app:analyze
      - web:infra:validate
      - api:infra:validate

  run:
    desc: Run the frontend and the API locally
    deps:
      - web:app:run
      - api:impl:run
