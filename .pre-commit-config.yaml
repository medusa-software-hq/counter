repos:
  - repo: local
    hooks:
      - id: eslint-counter-web
        name: ESLint (counter-web)
        language: system
        entry: bash -c 'cd apps/counter-web && npm run lint'
        files: ^apps/counter-web/.*\.(ts|tsx|js)$
        pass_filenames: false

      - id: prettier-counter-web
        name: Prettier (counter-web)
        language: system
        entry: bash -c 'cd apps/counter-web && npm run format:check'
        files: ^apps/counter-web/.*\.(ts|tsx|js|css|json|html)$
        pass_filenames: false

      - id: github-ci-lint
        name: github-ci lint
        language: system
        entry: github-ci lint
        files: ^\.github/.*\.yml$
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt
        language: system
        entry: terraform fmt -check -recursive
        files: ^infra/.*\.tf$
        pass_filenames: false

      - id: tflint
        name: tflint
        language: system
        entry: tflint --recursive
        files: ^infra/.*\.tf$
        pass_filenames: false
