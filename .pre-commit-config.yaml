repos:
  - repo: local
    hooks:
      - id: github-ci-lint
        name: github-ci lint
        language: system
        entry: github-ci lint
        files: ^\.github/.*\.yml$
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt
        language: system
        entry: terraform fmt -check -recursive
        files: ^infra/.*\.tf$
        pass_filenames: false

      - id: tflint
        name: tflint
        language: system
        entry: tflint --recursive
        files: ^infra/.*\.tf$
        pass_filenames: false
