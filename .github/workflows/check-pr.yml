name: Check PR

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check-infra:
    name: infra
    uses: ./.github/workflows/check-infra.yml

  check-workflows:
    name: workflows
    uses: ./.github/workflows/check-workflows.yml

  check-counter-web-app:
    name: counter-web
    uses: ./.github/workflows/check-counter-web-app.yml
