name: Check Terraform configuration

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  check-formatting:
    name: Check Terraform formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

  verify-config:
    name: Verify Terraform configuration
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      GITHUB_APP_ID: ${{ vars.GH_APP_CICD_HELPER_READ_ONLY_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.GH_APP_CICD_HELPER_READ_ONLY_INSTALLATION_ID }}
      GITHUB_APP_PEM_FILE: ${{ secrets.GH_APP_CICD_HELPER_READ_ONLY_PEM_CONTENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Initialize Terraform
        working-directory: infra
        run: terraform init

      - name: Validate Terraform configuration
        working-directory: infra
        run: terraform validate

      - name: Verify Terraform configuration is applied
        working-directory: infra
        run: terraform plan -detailed-exitcode; [ $? -ne 1 ]
