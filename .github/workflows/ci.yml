name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 24

permissions: read-all

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/counter-web/package-lock.json

      - name: Install counter-web dependencies
        run: npm ci
        working-directory: apps/counter-web

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Install github-ci
        run: |
          go install github.com/reugn/github-ci/cmd/github-ci@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: "~> 1.14"

      - uses: terraform-linters/setup-tflint@v4

      - uses: pre-commit/action@v3.0.1

  build-counter-web:
    name: Build (counter-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/counter-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/counter-web

      - name: TypeScript build
        run: npm run build
        working-directory: apps/counter-web
