name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: 24
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

permissions: read-all

# All required jobs should be marked as such in Terraform `0-foundation` config
jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/counter-web/package-lock.json

      - name: Install counter-web dependencies
        run: npm ci
        working-directory: apps/counter-web

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Install github-ci
        run: |
          go install github.com/reugn/github-ci/cmd/github-ci@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - uses: terraform-linters/setup-tflint@v6.2.2

      - uses: pre-commit/action@v3.0.1

  build-counter-web:
    name: Build (counter-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/counter-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/counter-web

      - name: Build
        run: npm run build
        working-directory: apps/counter-web

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: counter-web-dist
          path: apps/counter-web/dist/

  foundation-plan:
    name: Terraform Plan (foundation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_GH_ACTIONS_WORKLOAD_IDENTITY_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_CD_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra/1-foundation

      - name: Terraform Plan
        run: terraform plan | tee terraform-plan.txt
        working-directory: infra/1-foundation

      - name: Publish plan to step summary
        run: |
          {
            echo '## Terraform plan (foundation)'
            echo ''
            echo '```'
            cat terraform-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: infra/1-foundation

  foundation-apply:
    name: Terraform Apply (foundation)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      assets_bucket_name: ${{ steps.outputs.outputs.assets_bucket_name }}
      root_bucket_name: ${{ steps.outputs.outputs.root_bucket_name }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_GH_ACTIONS_WORKLOAD_IDENTITY_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_CD_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infra/1-foundation

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infra/1-foundation

      - name: Capture outputs
        id: outputs
        run: |
          echo "assets_bucket_name=$(terraform output -raw assets_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "root_bucket_name=$(terraform output -raw root_bucket_name)" >> "$GITHUB_OUTPUT"
        working-directory: infra/1-foundation

  deploy-counter-web:
    name: Deploy (counter-web)
    needs: [build-counter-web, foundation-apply]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      ASSETS_BUCKET: ${{ needs.foundation-apply.outputs.assets_bucket_name }}
      ROOT_BUCKET: ${{ needs.foundation-apply.outputs.root_bucket_name }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_GH_ACTIONS_WORKLOAD_IDENTITY_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_CD_SA_EMAIL }}

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: counter-web-dist
          path: dist/

      - name: Upload hashed assets to Cloud Storage
        run: gcloud storage rsync -r dist/assets/ gs://${{ env.ASSETS_BUCKET }}/assets/

      - name: Upload root files to Cloud Storage
        run: gcloud storage rsync -r --exclude="assets/.*" dist/ gs://${{ env.ROOT_BUCKET }}/
