name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY to confirm'
        required: true

env:
  TERRAFORM_VERSION: 1.14

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

jobs:
  foundation-destroy:
    name: Terraform Destroy (foundation)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - run: |
          if [[ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]]; then
            echo "Confirmation not provided. Exiting."
            exit 1
          fi

      - uses: actions/checkout@v6.0.2

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_GH_ACTIONS_WORKLOAD_IDENTITY_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_CD_SA_EMAIL }}

      - uses: hashicorp/setup-terraform@v4.0.0
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Destroy (Foundation)
        id: terraform
        run: |
          terraform init
          terraform destroy -auto-approve
        working-directory: infra/1-foundation
