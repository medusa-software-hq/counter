name: counter-web

on:
  push:
    branches: [main]
    paths:
      - "apps/counter-web/**"
  pull_request:
    paths:
      - "apps/counter-web/**"

env:
  NODE_VERSION: 24
  NO_COLOR: 1

  IMAGE_REF: ${{ vars.GCP_AR_REPO_ENDPOINT }}/counter-web
  IMAGE_TAG: ${{ github.sha }}

permissions: read-all

# All required jobs should be marked as such in Terraform `0-bootstrap` config
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_GH_ACTIONS_WORKLOAD_IDENTITY_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_CD_SA_EMAIL }}

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/counter-web/frontend/package-lock.json

      - uses: go-task/setup-task@v2

      - name: Build frontend
        run: task frontend:build
        working-directory: apps/counter-web

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_AR_REPO_HOSTNAME }} --quiet
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      - name: Build and push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >
          docker build
          -t ${{ env.IMAGE_REF }}:${{ env.IMAGE_TAG }}
          apps/counter-web/

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker push ${{ env.IMAGE_REF }}:${{ env.IMAGE_TAG }}

      - name: Build image (PR check)
        if: github.event_name == 'pull_request'
        run: docker build apps/counter-web/

      - name: Upload frontend assets artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: counter-web-assets
          path: apps/counter-web/frontend/dist/assets/

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_GH_ACTIONS_WORKLOAD_IDENTITY_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_CI_CD_SA_EMAIL }}

      - name: Download frontend assets artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: counter-web-assets
          path: assets/

      - name: Upload CSS and images to assets bucket
        run: gcloud storage rsync -r assets/ gs://${{ vars.GCP_COUNTER_WEB_ASSETS_BUCKET_NAME }}/assets/

      - name: Deploy frontend container to Cloud Run
        run: >
          gcloud run deploy ${{ vars.GCP_COUNTER_WEB_SERVICE_NAME }}
          --project=${{ vars.GCP_PROJECT_ID }}
          --region=${{ vars.GCP_COUNTER_WEB_SERVICE_LOCATION }}
          --image=${{ env.IMAGE_REF }}:${{ env.IMAGE_TAG }}
          --quiet
