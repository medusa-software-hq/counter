version: '3'

.caddySources: &caddySources
  - Caddyfile

includes:
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

tasks:
  caddy:fmt:check:
    desc: Check Caddyfile formatting
    sources: *caddySources
    cmds:
      - caddy fmt --diff Caddyfile

  caddy:fmt:fix:
    desc: Fix Caddyfile formatting
    sources: *caddySources
    cmds:
      - caddy fmt --overwrite Caddyfile

  caddy:validate:
    desc: Validate the Caddyfile
    sources: *caddySources
    cmds:
      - caddy validate --config Caddyfile

  fmt:check:
    desc: Check formatting (frontend + Caddyfile)
    deps: [frontend:fmt:check, caddy:fmt:check]

  fmt:fix:
    desc: Fix formatting (frontend + Caddyfile)
    deps: [frontend:fmt:fix, caddy:fmt:fix]

  lint:
    desc: Lint the app sources
    deps: [frontend:lint]

  analyze:
    desc: Analyze the app sources (frontend typecheck + tests + Caddy validate)
    deps: [frontend:typecheck, frontend:test, caddy:validate]

  build:
    desc: Build the frontend
    cmds:
      - task: frontend:build

  run:
    desc: Run the frontend dev server
    cmds:
      - task: frontend:dev
