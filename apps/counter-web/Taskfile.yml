# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - task: frontend:install

  build:backend:
    desc: Build the Go backend binary
    dir: backend
    cmds:
      - go build -o main .

  build:
    desc: Build frontend then backend
    cmds:
      - task: frontend:build
      - task: build:backend

  # Forwarding tasks expected by the root Taskfile
  checkFormatting:
    desc: Check formatting (frontend)
    cmds:
      - task: frontend:checkFormatting

  fixFormatting:
    desc: Fix formatting (frontend)
    cmds:
      - task: frontend:fixFormatting

  lint:
    desc: Lint the frontend
    cmds:
      - task: frontend:lint

  typecheck:
    desc: Type-check the frontend
    cmds:
      - task: frontend:typecheck
