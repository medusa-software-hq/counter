version: '3'

includes:
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend

  backend:
    taskfile: backend/Taskfile.yml
    dir: backend

tasks:
  checkFormatting:
    desc: Check formatting (frontend + backend)
    deps: [frontend:checkFormatting, backend:checkFormatting]

  fixFormatting:
    desc: Fix formatting (frontend + backend)
    deps: [frontend:fixFormatting, backend:fixFormatting]

  lint:
    desc: Lint the app sources (frontend + backend)
    deps: [frontend:lint, backend:lint]

  analyze:
    desc: Analyze the app sources (frontend + backend)
    deps: [frontend:typecheck, backend:build]

  build:
    desc: Build the full app (frontend + backend)
    cmds:
      - task: frontend:build
      - task: backend:build

  run:
    desc: Build frontend then run the backend server
    cmds:
      - task: frontend:build
      - task: backend:run
